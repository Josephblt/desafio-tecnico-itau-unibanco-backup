spring:
  application:
    name: desafio-tecnico-itau-unibanco
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:balance-consumer}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

dynamodb:
  endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
  region: ${DYNAMODB_REGION:us-east-1}
  table-name: ${BALANCE_TABLE_NAME:AccountBalances}

financial-transactions:
  topic-name: ${FINANCIAL_TRANSACTIONS_TOPIC:transacoes-financeiras-processadas}
